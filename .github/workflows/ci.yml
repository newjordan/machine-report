name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck and bats
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck bats
      - name: Lint and test
        run: make check
